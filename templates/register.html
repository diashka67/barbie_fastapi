<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — БарбиЛенд</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/register.css">
  <link rel="stylesheet" href="/static/barbie.css">
</head>
<body>
  <main class="card">
    <div id="register-view">
      <div class="crown" aria-hidden="true">🎀</div>
      <h1>Стань частью БарбиЛенда</h1>
      <p class="subtitle">Заполни форму — это займёт минутку 💅</p>

      <form id="register-form" novalidate>
        <div class="field">
          <label for="name">Имя</label>
          <input type="text" id="name" placeholder="Barbie" autocomplete="name">
          <div class="error" id="name-error"></div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
          <div class="error" id="email-error"></div>
        </div>

        <div class="field">
          <label for="password">Пароль</label>
          <input type="password" id="password" placeholder="Минимум 6 символов" autocomplete="new-password">
          <div class="strength"><div class="strength-bar" id="strength-bar"></div></div>
          <div class="strength-label" id="strength-label"></div>
          <div class="error" id="password-error"></div>
        </div>

        <div class="field">
          <label for="confirm">Повтори пароль</label>
          <input type="password" id="confirm" placeholder="Ещё раз" autocomplete="new-password">
          <div class="error" id="confirm-error"></div>
        </div>

        <button type="submit" class="btn" id="submit-btn">Зарегистрироваться 💖</button>
      </form>

      <p class="hint">Уже есть аккаунт? <a href="/login" class="link">Войти</a></p>
    </div>

    <div class="success" id="success-view">
      <div class="success-icon">🎉</div>
      <h2>Аккаунт создан!</h2>
      <p id="success-text">Теперь можно войти, используя свои данные.</p>
      <a href="/login" class="btn">Перейти ко входу</a>
    </div>
  </main>

  <script src="/sources/register.js"></script>
</body>
</html>
